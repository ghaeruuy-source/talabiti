<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة طلبيتي</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=8">
<style>
body{font-size:16px}
.page{max-width:920px}
.top{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px}
.top button{flex:1;padding:10px;border:0;border-radius:10px;background:none;font:600 .95rem var(--display);color:var(--mute);cursor:pointer;position:relative}
.top button[aria-current="true"]{background:var(--accent);color:var(--accent-fg)}
.top .dot{background:var(--deal);color:#fff;font-size:.72rem;border-radius:9px;padding:0 6px;margin-inline-start:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi span{font-size:.8rem;color:var(--mute)}
.kpi b{display:block;font:700 1.25rem var(--display)}
.kpi.hi{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}.kpi.hi span{color:inherit;opacity:.85}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.kpis .kpi:first-child{grid-column:1/-1}}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:500 .88rem var(--body);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ao{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.ao.pending{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.ao-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ao-h b{font:700 1.05rem var(--display)}
.ao-c{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px;font-size:.88rem;color:var(--mute);border-bottom:1px solid var(--line)}
.wa{display:inline-flex;align-items:center;gap:4px;background:#25D366;color:#fff!important;text-decoration:none;border-radius:999px;padding:1px 10px;font-weight:600;font-size:.82rem}
.ao-i{padding:12px 16px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.it{display:flex;gap:10px;align-items:center}
.it img{width:52px;height:52px;object-fit:cover;border-radius:10px;flex:none;background:var(--bg)}
.it .t{flex:1;min-width:0;font-size:.92rem}
.it .t a{color:var(--accent);font-size:.8rem}
.basket{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.basket a.btn{width:auto;color:var(--accent-fg)}
.ao-a{padding:12px 16px;display:grid;gap:10px;background:color-mix(in srgb,var(--bg) 55%,var(--card))}
.ao-a h4{margin:0;font:600 .9rem var(--display);color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row .field{flex:1;min-width:130px}
.pv{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.pv .big{font:700 1.3rem var(--display);color:var(--accent)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.8rem;color:var(--mute)}
.sum b{display:block;color:var(--ink);font:700 1rem var(--display)}
.sum .me b{color:var(--ok)}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps button{flex:1;min-width:90px;padding:8px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font:500 .8rem var(--body);color:var(--mute);cursor:pointer}
.steps button.done{background:color-mix(in srgb,var(--ok) 14%,var(--card));border-color:var(--ok);color:var(--ok);font-weight:700}
.tog{display:flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--ok)}
.citem{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.citem b{font:700 1rem var(--display)}
.citem label{display:flex;gap:6px;align-items:center;font-size:.88rem}
.citem input{width:auto}
.hint{font-size:.8rem;color:var(--mute)}
.stl{border-bottom:1px dashed var(--line);padding:6px 0;display:grid;gap:2px}
.q{display:flex;justify-content:space-between;gap:8px;align-items:center}
@media print{body *{visibility:hidden}.stmt,.stmt *{visibility:visible}.stmt{position:absolute;inset:0 0 auto 0;border:0}.no-print{display:none!important}}
.owe{background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:12px 16px;display:grid;gap:2px}
.owe span{font-size:.88rem;opacity:.9}.owe b{font:700 1.6rem var(--display)}.owe small{font-size:.78rem;opacity:.85}
.owe.ok{background:var(--ok)}
.pays{display:grid;gap:6px}
.pay{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card)}
.pay .hint{flex:1}.pay button{background:none;border:0;color:var(--mute);font-size:1rem;cursor:pointer}
.addpay{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.addpay[open]{display:grid;gap:10px}
.addpay summary{font:600 .95rem var(--display);color:var(--accent);cursor:pointer;padding:4px 0}
</style>
</head>
<body>
<header class="bar"><div class="container page"><b>لوحة طلبيتي</b><button class="btn sm ghost" type="button" id="logout" hidden>خروج</button></div></header>
<main class="container page" id="app"></main>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script>
const cfg=window.TALABITI||{};
const db=cfg.SUPABASE_URL?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iqd=n=>Math.round(+n||0).toLocaleString("en-US")+" د.ع";
const aed=n=>(+n||0).toFixed(2)+" درهم";
const STAGES=["انطلب من شي ان","بالطريق للعراق","وصل المخزن","بالتوصيل","تسلّم"];
const ST={pending:"جديد، يحتاج تسعير",quoted:"انرسل السعر",accepted:"وافق الزبون",rejected:"مرفوض",cancelled:"ملغي"};
const USD_AED=3.6725;
const qCur=()=>{try{return localStorage.getItem("qcur")==="AED"?"AED":"USD"}catch{return "USD"}};
const saleAED=id=>{const v=+$("sa"+id).value||0,c=$("sc"+id)?$("sc"+id).value:"AED";return c==="USD"?v*USD_AED:v};
const curPref=()=>{try{return localStorage.getItem("cur")==="USD"?"USD":"AED"}catch{return "AED"}};
const rateShown=()=>{const r=+settings?.rate_aed||0;return curPref()==="USD"?Math.round(r*USD_AED):r};
let adminEmail="";
let q="",rp="month",rFrom="",rTo="",stmtPhone="";
let orders=[],coupons=[],expenses=[],expOk=false,settings=null,filter="open",tab="orders";

function loginView(msg=""){
  $("app").innerHTML=`<div class="card" style="max-width:420px;margin:40px auto"><h2>تسجيل دخول</h2>
    <div class="field"><label for="em">الإيميل</label><input id="em" type="email" class="ltr" autocomplete="email"></div>
    <div class="field"><label for="pw">كلمة السر</label><input id="pw" type="password" class="ltr" autocomplete="current-password"></div>
    <p class="err" id="err">${esc(msg)}</p>
    <button class="btn" type="button" id="in">دخول</button></div>`;
  $("in").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)$("err").textContent="الإيميل أو كلمة السر غلط.";else boot()};
}
async function load(){
  const [o,c,s,e]=await Promise.all([db.from("orders").select("*").order("created_at",{ascending:false}).limit(300),db.from("coupons").select("*").order("created_at"),db.from("settings").select("*").eq("id",1).single(),db.from("expenses").select("*").order("spent_on",{ascending:false}).order("id",{ascending:false}).limit(500)]);
  orders=o.data||[];coupons=c.data||[];settings=s.data;expOk=!e.error;expenses=e.data||[];
}
function view(){
  let pend=0,sales=0,profit=0;
  orders.forEach(o=>{if(o.status==="pending")pend++;if(o.status==="accepted"){sales+=+o.total_iqd;profit+=+o.comm_iqd}});
  const qq=q.trim().toLowerCase();
  const list=orders.filter(o=>!qq||(o.customer_name+" "+o.phone+" #"+o.id).toLowerCase().includes(qq)).filter(o=>filter==="all"||(filter==="open"?["pending","quoted"].includes(o.status)||(o.status==="accepted"&&o.stage<4):filter==="done"?o.status==="accepted"&&o.stage>=4:o.status===filter));
  const T=[["orders","الطلبات",pend],["expenses","المصاريف",0],["reports","التقارير",0],["settings","الإعدادات",0]];
  let body="";
  if(tab==="orders")body=`
    <div class="kpis">
      <div class="kpi hi"><span>ربحك</span><b class="num">${iqd(profit)}</b></div>
      <div class="kpi"><span>مبيعات مأكدة</span><b class="num">${iqd(sales)}</b></div>
      <div class="kpi"><span>تحتاج تسعير</span><b class="num">${pend}</b></div></div>
    <input id="q" type="search" placeholder="🔍 دور باسم الزبون أو رقمه" value="${esc(q)}">
    <div class="filters">${[["open","المفتوحة"],["pending","تحتاج تسعير"],["quoted","بانتظار الزبون"],["accepted","مأكدة"],["done","تسلّمت"],["all","الكل"]].map(([k,l])=>`<button type="button" class="chip" aria-pressed="${filter===k}" data-f="${k}">${l}</button>`).join("")}</div>
    ${list.length?list.map(card).join(""):`<p class="empty">ماكو طلبات هنا.</p>`}`;
  else if(tab==="reports")body=reportsHTML();
  else if(tab==="expenses"){
    let inc=0;orders.forEach(o=>{if(o.status==="accepted")inc+=(+o.comm_iqd||0)+(+o.ship_iqd||0)+(+o.delivery_iqd||0)});
    const tot=expenses.reduce((x,e)=>x+ +e.amount_iqd,0),net=inc-tot;
    const cats=[...new Set(["شحن","توصيل","أخرى",...expenses.map(e=>e.category)])],by=c=>expenses.filter(e=>e.category===c).reduce((x,e)=>x+ +e.amount_iqd,0);
    body=!expOk?`<div class="card"><h3>المصاريف</h3><p class="hint">هذا التبويب بعده مو مفعّل (جدول المصاريف مو مضاف بقاعدة البيانات). المطوّر يفعّله وبعدها يشتغل.</p></div>`:`
    <div class="kpis">
      <div class="kpi hi"><span>ربحك الصافي</span><b class="num">${iqd(net)}</b></div>
      <div class="kpi"><span>مجموع المصاريف</span><b class="num">${iqd(tot)}</b></div>
      <div class="kpi"><span>داخل من الطلبات المأكدة</span><b class="num">${iqd(inc)}</b></div></div>
    <p class="hint">الصافي = عمولتك + الشحن والتوصيل اللي أخذتهم من الزبايين − مصاريفك. ${cats.map(c=>`${c}: ${iqd(by(c))}`).join(" · ")}</p>
    <div class="card"><h3>سجّل مصروف</h3>
      <div class="row"><div class="field" style="flex:2"><label for="xTitle">شنو المصروف؟</label><input id="xTitle" placeholder="مثلاً: شحنة الأسبوع"></div>
        <div class="field"><label for="xCat">النوع (اختار أو اكتب نوع جديد)</label><input id="xCat" list="xCats" value="${esc(cats[0])}" autocomplete="off"><datalist id="xCats">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div></div>
      <div class="row"><div class="field"><label for="xAmt">المبلغ</label><input id="xAmt" type="number" inputmode="decimal" step="any"></div>
        <div class="field" style="max-width:130px"><label for="xCur">العملة</label><select id="xCur"><option value="IQD">دينار</option><option value="USD">دولار</option></select></div></div>
      <p class="hint" id="xConv"></p>
      <div class="row">
        <div class="field"><label for="xDate">التاريخ</label><input id="xDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div>
      <p class="err" id="xErr"></p><button class="btn" type="button" id="addX">أضف المصروف</button></div>
    ${expenses.length?`<div class="card"><h3>المصاريف المسجلة</h3>${expenses.map(e=>`<div class="citem"><span><b>${esc(e.title)}</b> <span class="pill new">${esc(e.category)}</span><br><span class="hint">${esc(e.spent_on)}</span></span><span style="display:flex;gap:10px;align-items:center"><b class="num">${iqd(e.amount_iqd)}</b><button class="btn sm ghost" type="button" data-delx="${e.id}">احذف</button></span></div>`).join("")}</div>`:`<p class="empty">ماكو مصاريف مسجلة.</p>`}`;
  }
  else body=`<div class="card"><h3>عروض اليوم</h3><p class="hint">الكوبونات الفعّالة تطلع للزبون بالموقع، وأحسن كوبون ينحسب وحده بالتسعير. استعمل نفس الكود بشي ان من تشتري.</p>
      ${coupons.length?coupons.map(c=>`<div class="citem"><span><b class="ltr">${esc(c.code)}</b> · خصم ${+c.pct}% ${+c.min_aed?`· فوق ${+c.min_aed} درهم`:"· على أي طلب"}</span><span style="display:flex;gap:10px;align-items:center"><label><input type="checkbox" data-on="${c.id}"${c.active?" checked":""}> فعّال</label><button class="btn sm ghost" type="button" data-del="${c.id}">احذف</button></span></div>`).join(""):`<p class="hint">ماكو كوبونات بعد.</p>`}
      <h3 style="margin-top:8px">كوبون جديد</h3>
      <div class="row"><div class="field"><label for="nCode">الكود (مثل ما بشي ان)</label><input id="nCode" class="ltr"></div><div class="field"><label for="nPct">الخصم ٪</label><input id="nPct" type="number" value="20"></div><div class="field"><label for="nMin">إذا الطلب فوق (درهم)</label><input id="nMin" type="number" value="0"></div></div>
      <button class="btn" type="button" id="addC">أضف الكوبون</button></div>
    <div class="card"><h3>الأسعار</h3>
      <div class="row">
        <div class="field"><label for="sCur">سعر الصرف حسب</label><select id="sCur"><option value="AED"${curPref()==="AED"?" selected":""}>الدرهم</option><option value="USD"${curPref()==="USD"?" selected":""}>الدولار</option></select></div>
        <div class="field"><label for="sRate" id="sRateL">${curPref()==="USD"?"الدولار بكم دينار؟":"الدرهم بكم دينار؟"}</label><input id="sRate" type="number" inputmode="decimal" step="any" value="${rateShown()}"></div>
        <div class="field"><label for="sComm">ربحك (عمولة ٪)</label><input id="sComm" type="number" value="${+settings?.commission_pct}"></div></div>
      <div class="row">
        <div class="field"><label for="sShip">شحن جوي ✈️ لكل كيلو (دينار)</label><input id="sShip" type="number" value="${+settings?.ship_per_kg}"></div>
        <div class="field"><label for="sSea">شحن بحري 🚢 لكل متر مكعب (دينار)</label><input id="sSea" type="number" value="${settings&&"ship_sea_per_cbm" in settings?+settings.ship_sea_per_cbm:""}" ${settings&&"ship_sea_per_cbm" in settings?"":"disabled placeholder=\"يتفعّل بعد تحديث قاعدة البيانات\""}></div>
        <div class="field"><label for="sDel">التوصيل (دينار)</label><input id="sDel" type="number" value="${+settings?.delivery}"></div>
        <div class="field"><label for="sDep">العربون ٪</label><input id="sDep" type="number" value="${+settings?.deposit_pct}"></div></div>
      <h3 style="margin-top:8px">الصفحة</h3>
      <div class="field"><label for="sName">اسم الصفحة</label><input id="sName" value="${esc(settings?.shop_name)}"></div>
      <div class="field"><label for="sWa">رقم الواتساب</label><input id="sWa" class="ltr" value="${esc(settings?.whatsapp)}"></div>
      <div class="field"><label for="sUrl">رابط شي ان</label><input id="sUrl" class="ltr" value="${esc(settings?.shein_url)}"></div>
      <p class="hint">الأسعار بشي ان الإمارات بالدرهم. إذا اخترت الدولار، الموقع يحوله للدرهم بالسعر الثابت (١ دولار = ٣.٦٧٢٥ درهم) وبعدها للدينار.</p><p class="sub" id="sMsg"></p>
      <button class="btn" type="button" id="saveS">احفظ</button></div>
    <div class="card"><h3>حساب الدخول</h3>
      <p class="hint">الإيميل الحالي: <b class="ltr">${esc(adminEmail)}</b></p>
      <div class="field"><label for="aMail">إيميل جديد (اختياري)</label><input id="aMail" type="email" class="ltr" autocomplete="off"></div>
      <div class="field"><label for="aPw">كلمة سر جديدة (٨ أحرف على الأقل)</label><input id="aPw" type="password" class="ltr" autocomplete="new-password"></div>
      <div class="field"><label for="aPw2">أعد كتابة كلمة السر</label><input id="aPw2" type="password" class="ltr" autocomplete="new-password"></div>
      <p class="hint">تغيير الإيميل يوصلك عليه رابط تأكيد، وما يتغير إلا بعد ما تفتحه.</p>
      <p class="sub" id="aMsg"></p><button class="btn" type="button" id="saveA">حدّث حساب الدخول</button></div>
    <div class="card"><h3>نسخة احتياطية</h3><p class="hint">تنزل ملفين تفتحهم بالإكسل: الطلبات والمصاريف.</p>
      <button class="btn ghost" type="button" id="bk">⬇️ نزّل نسخة احتياطية (إكسل)</button>
      <p class="hint" style="margin-top:8px">النسخة الكاملة: ملف واحد بكل بيانات النظام (الطلبات، القبض، المصاريف، الكوبونات، الإعدادات) تحتفظ بيه إذا صار شي.</p>
      <p class="sub" id="bkMsg"></p><button class="btn" type="button" id="bkFull">💾 نسخة كاملة للنظام</button></div>`;
  $("app").innerHTML=`<div class="top">${T.map(([k,l,n])=>`<button type="button" data-tab="${k}" aria-current="${tab===k}">${l}${n?`<span class="dot">${n}</span>`:""}</button>`).join("")}</div>${body}`;
  bind();
}

function dstr(d){return new Date(d).toISOString().slice(0,10)}
function range(){const now=new Date(),t=dstr(now);
  if(rp==="today")return[t,t];
  if(rp==="week"){const d=new Date(now);d.setDate(d.getDate()-6);return[dstr(d),t]}
  if(rp==="month")return[t.slice(0,8)+"01",t];
  if(rp==="custom")return[rFrom||"0000-00-00",rTo||"9999-12-31"];
  return["0000-00-00","9999-12-31"]}
function reportsHTML(){
  const [a,b]=range();
  const os=orders.filter(o=>o.status==="accepted"&&dstr(o.accepted_at||o.created_at)>=a&&dstr(o.accepted_at||o.created_at)<=b);
  const ex=expenses.filter(e=>e.spent_on>=a&&e.spent_on<=b);
  const sum=(arr,f)=>arr.reduce((x,o)=>x+(+f(o)||0),0);
  const sales=sum(os,o=>o.total_iqd),goods=sum(os,o=>o.goods_iqd),comm=sum(os,o=>o.comm_iqd),ship=sum(os,o=>o.ship_iqd)+sum(os,o=>o.delivery_iqd),exp=sum(ex,e=>e.amount_iqd);
  const paid=sum(os,o=>o.paid_iqd),net=comm+ship-exp;
  const by={};os.forEach(o=>{const k=o.phone;(by[k]=by[k]||{name:o.customer_name,phone:o.phone,n:0,sales:0,comm:0}).n++;by[k].sales+=+o.total_iqd||0;by[k].comm+=+o.comm_iqd||0});
  const top=Object.values(by).sort((x,y)=>y.sales-x.sales).slice(0,10);
  const lbl={today:"اليوم",week:"آخر ٧ أيام",month:"هذا الشهر",all:"الكل",custom:"فترة محددة"}[rp];
  window.__report=`📊 تقرير ${lbl}${rp==="custom"?` (${a} → ${b})`:""}\nالطلبات المأكدة: ${os.length}\nالمبيعات: ${iqd(sales)}\nبضاعة شي ان: ${iqd(goods)}\nعمولتك: ${iqd(comm)}\nشحن وتوصيل مأخوذ: ${iqd(ship)}\nالمصاريف: ${iqd(exp)}\nالربح الصافي: ${iqd(net)}\nالمقبوض فعلاً: ${iqd(paid)}\nالمتبقي عند الزبايين: ${iqd(sales-paid)}`;
  const custs={};orders.filter(o=>o.status==="accepted").forEach(o=>custs[o.phone]=o.customer_name);
  return `

  if($("bkFull"))$("bkFull").onclick=async()=>{const m=$("bkMsg");m.className="sub";m.textContent="دا أجمع البيانات…";
    const out={app:"talabiti",exported_at:new Date().toISOString()};
    for(const t of ["orders","expenses","coupons","settings"]){const {data,error}=await db.from(t).select("*");if(error){m.className="err";m.textContent=t+": "+error.message;return}out[t]=data}
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));a.download="talabiti-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();
    m.textContent=`انحفظت النسخة ✓ (${out.orders.length} طلب، ${out.expenses.length} مصروف)`};
  if($("bk"))$("bk").onclick=()=>{const csv=(name,head,rows)=>{const e=v=>`"${String(v??"").replace(/"/g,'""')}"`;
      const t="\ufeff"+[head,...rows].map(r=>r.map(e).join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download=name+"-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove()};
    csv("orders",["رقم","التاريخ","الزبون","الموبايل","المحافظة","الحالة","المرحلة","المجموع","العمولة","المقبوض","المتبقي","كوبون","الرابط الأول"],orders.map(o=>[o.id,String(o.created_at).slice(0,10),o.customer_name,o.phone,o.city,ST[o.status]||o.status,STAGES[o.stage]||"",o.total_iqd,o.comm_iqd,o.paid_iqd,Math.max(0,(+o.total_iqd||0)-(+o.paid_iqd||0)),o.coupon_code,(o.items&&o.items[0]&&o.items[0].link)||""]));
    setTimeout(()=>csv("expenses",["التاريخ","المصروف","النوع","المبلغ (دينار)"],expenses.map(e=>[e.spent_on,e.title,e.category,e.amount_iqd])),400)};
  if($("saveS"))$("saveS").onclick=async()=>{const {error}=await db.from("settings").update({shop_name:$("sName").value.trim(),whatsapp:$("sWa").value.replace(/\D/g,"").replace(/^0(?=7)/,"964"),shein_url:$("sUrl").value.trim(),rate_aed:Math.round((($("sCur").value==="USD"?+$("sRate").value/USD_AED:+$("sRate").value))*10000)/10000,ship_per_kg:+$("sShip").value,...("ship_sea_per_cbm" in (settings||{})?{ship_sea_per_cbm:+$("sSea").value}:{}),commission_pct:+$("sComm").value,delivery:+$("sDel").value,deposit_pct:+$("sDep").value,updated_at:new Date().toISOString()}).eq("id",1);$("sMsg").textContent=error?error.message:"انحفظت ✓"};
}
let unseen=0;const baseTitle=document.title;
function newOrderAlert(o){unseen++;document.title=`(${unseen}) طلب جديد · ${baseTitle}`;
  try{const c=new (window.AudioContext||window.webkitAudioContext)(),g=c.createGain();g.connect(c.destination);g.gain.value=.15;[880,1175].forEach((f,i)=>{const x=c.createOscillator();x.frequency.value=f;x.connect(g);x.start(c.currentTime+i*.18);x.stop(c.currentTime+i*.18+.16)})}catch{}
  const b=document.createElement("div");b.className="toast";b.style.cssText="position:fixed;top:64px;inset-inline:16px;z-index:20;text-align:center;font-weight:700";b.textContent=`🔔 طلب جديد من ${o&&o.customer_name||"زبون"}`;document.body.appendChild(b);setTimeout(()=>b.remove(),6000)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){unseen=0;document.title=baseTitle}});
async function boot(){
  if(!db){$("app").innerHTML=`<p class="err">الموقع بعده مو مربوط بقاعدة البيانات.</p>`;return}
  const {data:{session}}=await db.auth.getSession();
  if(!session){$("logout").hidden=true;loginView();return}
  const {data:adm}=await db.from("admins").select("user_id").eq("user_id",session.user.id).maybeSingle();
  if(!adm){loginView("هذا الحساب مو مفعّل كمدير بعد.");return}
  adminEmail=session.user.email||"";$("logout").hidden=false;$("logout").onclick=async()=>{await db.auth.signOut();boot()};
  await load();view();
  db.channel("orders").on("postgres_changes",{event:"*",schema:"public",table:"orders"},async(e)=>{await load();view();if(e.eventType==="INSERT")newOrderAlert(e.new)}).subscribe();
}
boot();
</script>
