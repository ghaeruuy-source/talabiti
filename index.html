<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلبيتي</title>
<meta name="description" content="تسوّق من شي ان الإمارات، وإحنا نوصلها لباب بيتك بالعراق.">
<meta name="theme-color" content="#C2185B">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<header class="bar"><div class="container"><b id="shopName">طلبيتي</b><span style="font-size:.82rem;opacity:.9">من شي ان الإمارات لباب بيتك</span></div></header>
<main class="container" id="view" aria-live="polite"></main>
<nav class="tabs" aria-label="أقسام الموقع">
  <button type="button" data-tab="home">الرئيسية</button>
  <button type="button" data-tab="add">أضف قطعة</button>
  <button type="button" data-tab="cart">السلة<span class="badge" id="cartBadge" hidden></span></button>
  <button type="button" data-tab="orders">طلباتي<span class="badge" id="ordBadge" hidden></span></button>
</nav>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script>
const cfg=window.TALABITI||{};
const db=(cfg.SUPABASE_URL&&window.supabase)?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iqd=n=>Math.round(+n||0).toLocaleString("en-US")+" د.ع";
const aed=n=>iqd(Math.round((+n||0)*(+settings.rate_aed||0)/250)*250);
const STAGES=["انطلب من شي ان","بالطريق للعراق","وصل المخزن","بالتوصيل","تسلّم"];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let settings={rate_aed:410,shop_name:"طلبيتي",shein_url:"https://ar.shein.com/",whatsapp:""},coupons=[],orders=[];
let cart=store.get("cart",[]),me=store.get("me",{name:"",phone:"",city:"",address:""}),codes=store.get("codes",[]);
let tab="home",flash="",draft={},shipMode=store.get("ship","air");
let calcStage="form",calcData={},calcErr="";
// طلب تسعير سريع: الزبون يلصق الرابط، حامد يسعّر، والسعر يطلع هنا لحاله
let preq=store.get("preq",null),pollT=null;
if(preq&&preq.code)calcStage=preq.priced?"priced":"waiting";

// رابط مشارك من تطبيق شي ان (أندرويد) أو ?link=
const qp=new URLSearchParams(location.search);
const shared=[qp.get("url"),qp.get("text"),qp.get("link")].filter(Boolean).join(" ");
const LINK_RE=/https?:\/\/[^\s]*shein\.(com|top)[^\s]*/i;
const m=shared.match(LINK_RE);
const IN_APP=/TalabitiApp/.test(navigator.userAgent);
if(m){
  const num=v=>{const x=parseFloat(String(v||"").replace(/[^0-9.]/g,""));return x>0?x:""};
  let sale=num(qp.get("sale")),orig=num(qp.get("orig"));
  if(!orig)orig=sale; if(sale&&orig&&sale>orig)[sale,orig]=[orig,sale];
  draft={link:m[0],name:(qp.get("name")||"").replace(/\s*\|\s*SHEIN.*$/i,"").slice(0,120),img:/^https:\/\//.test(qp.get("img")||"")?qp.get("img"):"",orig,sale:sale===orig?"":sale,size:(qp.get("size")||"").slice(0,30)};
  tab="add";history.replaceState(null,"",location.pathname)}

function bestCoupon(sale){return coupons.filter(c=>sale>=+c.min_aed).sort((a,b)=>b.pct-a.pct)[0]||null}
function saveCart(){store.set("cart",cart)}
const KG_PC=0.35;
const waNum=v=>{let d=String(v||"").replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("0"))d="964"+d.slice(1);return d.length>=10?d:""};
// نفس حساب السيرفر: كوبون + شحن جوي بوزن تقريبي للقطع + خدمة + توصيل
function estimate(sale,pcs,mode){const S=settings,c=bestCoupon(sale),net=sale-(c?sale*c.pct/100:0),R=+S.rate_aed||0;
  const goods=Math.round(net*R),ship=mode==="sea"?null:Math.round(Math.round(pcs*KG_PC*100)/100*(+S.ship_per_kg||0)),comm=Math.round(net*R*(+S.commission_pct||0)/100),del=+S.delivery||0;
  return{c,goods,ship,comm,del,total:goods+(ship||0)+comm+del,saved:Math.round((sale-net)*R)}}
function estBox(e){return`<div class="quote">
  <div class="q"><span>البضاعة${e.c?` (بعد كوبون ${esc(e.c.code)} ${+e.c.pct}%)`:""}</span><span class="num">${iqd(e.goods)}</span></div>
  <div class="q"><span>الشحن للعراق</span><span class="num">${e.ship==null?"بعد القياس":iqd(e.ship)}</span></div>
  <div class="q"><span>خدمة الطلب</span><span class="num">${iqd(e.comm)}</span></div>
  <div class="q"><span>التوصيل</span><span class="num">${iqd(e.del)}</span></div>
  <div class="q t"><span>${e.ship==null?"المجموع بدون الشحن":"السعر النهائي"}</span><span class="num">${iqd(e.total)}</span></div></div>
  ${e.saved>0?`<div class="saved">وفّرت ${iqd(e.saved)} بالكوبون</div>`:""}`}
function readBox(R){return`<p class="sub">✓ قرينا سلتك: <b>${R.pieces}</b> قطعة. إذا الرقم غلط ارفع صورة أوضح.</p>${estBox(estimate(R.total_aed,R.pieces,shipMode))}`}
// نصغّر الصورة قبل لا نرفعها حتى تروح بسرعة
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const M=1568,k=Math.min(1,M/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);res(cv.toDataURL("image/jpeg",0.85))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};img.src=u})}
async function runQuote(){
  calcData.link=(($("qLink")&&$("qLink").value)||calcData.link||"").trim();
  const lm=calcData.link.match(LINK_RE);
  if(!lm){calcErr="الصق رابط سلتك من شي ان.";render();return}
  calcData.link=lm[0];
  if(!calcData.imgData){calcErr="صوّر سلتك وبيها المجموع، وارفع الصورة.";render();return}
  if(!db){calcErr="الموقع بعده مو مربوط، جرّب بعدين.";render();return}
  calcErr="";calcStage="loading";render();scrollTo(0,0);
  let i=0;const adv=()=>{const a=$("qs"+i);if(a){a.classList.remove("on");a.classList.add("done")}i++;const b=$("qs"+i);if(b)b.classList.add("on")};
  const t1=setTimeout(adv,1500),t2=setTimeout(adv,3200);
  let res=null;
  try{const [{data,error}]=await Promise.all([db.functions.invoke("cart-price",{body:{image:calcData.imgData}}),new Promise(z=>setTimeout(z,1800))]);res=error?null:data}catch{}
  clearTimeout(t1);clearTimeout(t2);
  if(res&&res.ok&&res.read_id){calcData.read=res;calcStage="result"}
  else{calcStage="form";calcErr=res&&res.nokey?"التسعير الفوري مو مفعّل بعد. أضف سلتك من «أضف قطعة» وصاحب الصفحة يسعّرها.":(res&&res.reason)||"ما كدرنا نقرا صورة سلتك. جرّب سكرين شوت أوضح وبيه المجموع."}
  if(tab==="calc")render();
}
async function requestPrice(){
  calcData.link=(($("qLink")&&$("qLink").value)||calcData.link||"").trim();
  const lm=calcData.link.match(LINK_RE);
  if(!lm){calcErr="الصق رابط سلتك من شي ان.";render();return}
  if(!db){calcErr="الموقع بعده مو مربوط، جرّب بعدين.";render();return}
  const ph=(($("qPhone")&&$("qPhone").value)||"").trim();
  if(ph&&!/^(0?7\d{9}|9647\d{9})$/.test(ph.replace(/\D/g,""))){calcErr="اكتب رقم موبايل عراقي صحيح، أو خليه فارغ.";render();return}
  if(ph){me.phone=ph;store.set("me",me)}
  $("qGo").disabled=true;$("qGo").textContent="دا يرسل…";
  const {data,error}=await db.rpc("request_price",{p_link:lm[0],p_phone:ph});
  if(error){calcErr=error.message||"صار خطأ، جرّب مرة ثانية.";render();return}
  const row=Array.isArray(data)?data[0]:data;
  preq={code:row.code,link:lm[0],at:Date.now()};store.set("preq",preq);
  calcErr="";calcData={};calcStage="waiting";render();scrollTo(0,0);startPoll();
}
async function checkPrice(){
  if(!db||!preq||!preq.code||preq.priced)return;
  const {data}=await db.rpc("check_price",{p_code:preq.code});
  const r=Array.isArray(data)?data[0]:data;
  if(!r){preq=null;store.set("preq",null);calcStage="form";stopPoll();if(tab==="calc")render();return}
  if(r.status==="priced"&&!r.used){preq.priced={total_aed:+r.total_aed,pieces:+r.pieces};store.set("preq",preq);calcStage="priced";stopPoll();
    try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch{}
    document.title="✓ وصل سعر سلتك";if(tab!=="calc")tab="calc";render();scrollTo(0,0)}
  else if(r.status==="rejected"){calcErr=r.admin_note||"ما كدرنا نسعّر هالسلة. تأكد من الرابط أو راسلنا واتساب.";preq=null;store.set("preq",null);calcStage="form";stopPoll();if(tab==="calc")render()}
  else if(r.used){preq=null;store.set("preq",null);calcStage="form";stopPoll()}
}
function startPoll(){stopPoll();pollT=setInterval(checkPrice,5000)}
function stopPoll(){if(pollT){clearInterval(pollT);pollT=null}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&preq&&!preq.priced)checkPrice()});
function tabs(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab));
  const cq=cart.reduce((a,c)=>a+c.qty,0);$("cartBadge").hidden=!cq;$("cartBadge").textContent=cq;
  const need=orders.filter(o=>o.status==="quoted").length;$("ordBadge").hidden=!need;$("ordBadge").textContent=need;
}
function go(t){tab=t;render();scrollTo(0,0)}

function render(){
  tabs();const el=$("view");
  const notice=!db?`<p class="err">الموقع بعده مو مربوط بقاعدة البيانات.</p>`:"";
  if(tab==="home"){
    el.innerHTML=`${notice}
      <div class="pcal"><div class="top"><span class="chip">⚡ تسعير سريع</span><h2>شگد سعر سلتك؟</h2><p>الصق رابط سلتك بس، ويوصلك السعر بالدينار شامل الشحن خلال دقائق.</p>
        <button class="btn" type="button" id="goCalc" style="background:#fff;color:#7B1FA2;margin-top:6px">احسب سعر سلتي ←</button></div></div>
      ${IN_APP?"":`<div class="card" style="border:2px solid var(--accent)"><h3>رجعت من شي ان؟ الصق رابط القطعة أو رابط سلتك هنا</h3>
        <div class="field"><input id="hLink" class="ltr" inputmode="url" placeholder="الصق الرابط هنا" aria-label="رابط القطعة"></div>
        <div class="two"><button class="btn ghost" type="button" id="hPaste">📋 الصق</button><button class="btn" type="button" id="hNext">التالي</button></div>
        <p class="err" id="hErr"></p></div>`}
      <div class="hero"><h2>تسوّق من شي ان الإمارات، وإحنا نوصلها لباب بيتك</h2>
        <p>كل الخصومات اللي تشوفها بشي ان تنحسبلك، وفوكاها كوبونات عروض اليوم.</p>
        <a class="btn" href="${esc(settings.shein_url)}" target="_blank" rel="noopener">تسوّق من شي ان</a></div>
      <button class="btn ghost" type="button" id="goCart">عندك سلة جاهزة بشي ان؟ الصق رابطها</button>
      <div class="card"><h3>شلون تطلب</h3>${IN_APP?`<ol class="howto">
        <li>اضغط «تسوّق من شي ان» وتصفح عادي</li>
        <li>بصفحة القطعة اختار القياس واضغط <b>＋ أضف لطلبي</b></li>
        <li>تأكد من التفاصيل وضيفها للسلة، وكرر لكل قطعة</li>
        <li>أرسل سلتك، ويوصلك السعر النهائي بالدينار. ما تدفع شي قبل ما توافق</li></ol>`:`<ol class="howto">
        <li>اضغط «تسوّق من شي ان»، ينفتح شي ان بصفحة ثانية. اختار القطعة اللي تعجبك</li>
        <li>بصفحة القطعة اضغط زر المشاركة <b>↗</b> واختار <b>نسخ الرابط</b></li>
        <li>ارجع لهالصفحة (من التبويبات أو زر الرجوع)، اضغط <b>📋 الصق</b> فوق، و«التالي»</li>
        <li>اكتب السعر والقياس، ضيفها للسلة، وكرر لكل قطعة</li>
        <li>أرسل سلتك، ويوصلك السعر النهائي بالدينار. ما تدفع شي قبل ما توافق</li></ol>`}</div>
      ${coupons.length?`<h3>عروض اليوم</h3>${coupons.map(c=>`<div class="coupon"><div><b>خصم ${+c.pct}%</b><p class="sub">${+c.min_aed?`على طلبك فوق ${aed(c.min_aed)}`:"على أي طلب"}</p></div><span class="pill new ltr">${esc(c.code)}</span></div>`).join("")}<p class="sub">ما تحتاج تكتب الكود، ينحسب وحده على طلبك.</p>`:""}
      ${IN_APP?"":`<p class="sub" style="text-align:center">نصيحة: ضيف هالموقع لشاشة موبايلك (من قائمة المتصفح ← إضافة للشاشة الرئيسية) حتى ترجعله بسرعة.</p>`}
      ${settings.whatsapp?`<p class="sub" style="text-align:center">عندك سؤال؟ واتساب: <a class="ltr" href="https://wa.me/${esc(settings.whatsapp)}" target="_blank" rel="noopener">${esc(settings.whatsapp)}</a></p>`:""}`;
    $("goCart").onclick=()=>go("calc");
    $("goCalc").onclick=()=>{calcErr="";go("calc")};
    if($("hPaste"))$("hPaste").onclick=async()=>{try{const t=await navigator.clipboard.readText();$("hLink").value=t;$("hErr").textContent=""}catch{$("hErr").textContent="المتصفح ما سمح. اضغط مطولاً بالخانة واختار لصق."}};
    if($("hNext"))$("hNext").onclick=()=>{const lm=$("hLink").value.match(LINK_RE);if(!lm){$("hErr").textContent="هذا مو رابط من شي ان. انسخه من زر المشاركة بصفحة القطعة.";return}draft={link:lm[0],cart:/cart|bag|share|سلة|السلة/i.test($("hLink").value)};go("add")};
    return;
  }
  if(tab==="calc"){
    if(calcStage==="loading"){
      el.innerHTML=`<div class="loader"><div class="orb">🚚</div><h3>دنحضّر التسعيرة</h3><p class="sub">تاخذ من ٥ لـ ١٥ ثانية عادةً.</p><div class="bar"><i></i></div>
        <div class="steps"><div class="s on" id="qs0"><span class="n">1</span>دنقرأ سلتك…</div><div class="s" id="qs1"><span class="n">2</span>دنحسب الشحن للعراق…</div><div class="s" id="qs2"><span class="n">3</span>دنحوّل الأسعار للدينار…</div></div></div>`;
      return;
    }
    if(calcStage==="waiting"&&preq){
      el.innerHTML=`<div class="loader"><div class="orb">⏳</div><h3>سعرك يوصلك خلال دقائق</h3>
        <p class="sub">وصلنا رابط سلتك، ونفتحها ونسعّرها هسه. خلي هالصفحة مفتوحة، والسعر يطلع هنا لحاله.</p><div class="bar"><i></i></div>
        <p class="sub ltr" style="word-break:break-all;opacity:.7">${esc(preq.link)}</p>
        ${settings.whatsapp?`<p class="sub">مستعجل؟ <a href="https://wa.me/${esc(waNum(settings.whatsapp))}?text=${encodeURIComponent("مرحبا، طلبت سعر سلة من الموقع، كود "+preq.code)}" target="_blank" rel="noopener">راسلنا واتساب</a></p>`:""}
        <button class="btn ghost" type="button" id="qCancel">إلغاء وسلة ثانية</button></div>`;
      $("qCancel").onclick=()=>{preq=null;store.set("preq",null);stopPoll();calcStage="form";render()};
      if(!pollT)startPoll();
      return;
    }
    if(calcStage==="priced"&&preq&&preq.priced){
      const P=preq.priced,e=estimate(P.total_aed,P.pieces,"air"),dep=Math.round(e.total*(+settings.deposit_pct||0)/100/1000)*1000;
      el.innerHTML=`<div class="pcal">
        <div class="bigp"><span class="lbl">🛍️ سلتك · ${P.pieces} قطعة</span><span class="amt num">${iqd(e.total)}</span><span class="inc">السعر شامل كلشي — البضاعة والشحن والتوصيل</span></div>
        <div class="rowbox">
          <div class="q"><span>البضاعة${e.c?` <small class="sub">(بعد كوبون ${esc(e.c.code)} ${+e.c.pct}%)</small>`:""}</span><span class="num">${iqd(e.goods)}</span></div>
          <div class="q"><span>الشحن للعراق ✈️</span><span class="num">${iqd(e.ship)}</span></div>
          <div class="q"><span>خدمة الطلب</span><span class="num">${iqd(e.comm)}</span></div>
          <div class="q"><span>التوصيل</span><span class="num">${iqd(e.del)}</span></div></div>
        ${e.saved>0?`<div class="saved">وفّرت ${iqd(e.saved)} بالكوبون</div>`:""}
        ${dep>0?`<div class="dep"><span>🏷️ العربون المطلوب</span><span class="num">${iqd(dep)}</span></div>`:""}
        <button class="btn" type="button" id="qOrder">اطلبها هسه ←</button>
        <button class="btn ghost" type="button" id="qAgain">احسب سلة ثانية</button></div>`;
      $("qOrder").onclick=()=>{cart=cart.filter(i=>i.req!==preq.code);cart.push({link:preq.link,name:`سلة شي ان كاملة (${P.pieces} قطعة)`,size:"—",qty:1,orig:P.total_aed,sale:P.total_aed,img:"",basket:true,count:P.pieces,req:preq.code});
        saveCart();shipMode="air";store.set("ship","air");calcStage="form";go("cart")};
      $("qAgain").onclick=()=>{preq=null;store.set("preq",null);calcData={};calcStage="form";calcErr="";render()};
      return;
    }
    if(calcStage==="result"&&calcData.read){
      const R=calcData.read,e=estimate(R.total_aed,R.pieces,"air"),dep=Math.round(e.total*(+settings.deposit_pct||0)/100/1000)*1000;
      el.innerHTML=`<div class="pcal">
        <div class="bigp"><span class="lbl">🛍️ سلتك · ${R.pieces} قطعة</span><span class="amt num">${iqd(e.total)}</span><span class="inc">السعر شامل كلشي — البضاعة والشحن والتوصيل</span></div>
        <div class="rowbox">
          <div class="q"><span>البضاعة${e.c?` <small class="sub">(بعد كوبون ${esc(e.c.code)} ${+e.c.pct}%)</small>`:""}</span><span class="num">${iqd(e.goods)}</span></div>
          <div class="q"><span>الشحن للعراق ✈️</span><span class="num">${iqd(e.ship)}</span></div>
          <div class="q"><span>خدمة الطلب</span><span class="num">${iqd(e.comm)}</span></div>
          <div class="q"><span>التوصيل</span><span class="num">${iqd(e.del)}</span></div></div>
        ${e.saved>0?`<div class="saved">وفّرت ${iqd(e.saved)} بالكوبون</div>`:""}
        ${dep>0?`<div class="dep"><span>🏷️ العربون المطلوب</span><span class="num">${iqd(dep)}</span></div>`:""}
        <p class="sub" style="text-align:center">قرينا من صورتك: ${R.pieces} قطعة. إذا الرقم غلط ارجع وارفع صورة أوضح.</p>
        <button class="btn" type="button" id="qOrder">اطلبها هسه ←</button>
        <button class="btn ghost" type="button" id="qAgain">احسب سلة ثانية</button></div>`;
      $("qOrder").onclick=()=>{cart.push({link:calcData.link,name:`سلة شي ان كاملة (${R.pieces} قطعة)`,size:"—",qty:1,orig:R.total_aed,sale:R.total_aed,img:"",basket:true,count:R.pieces,read_id:R.read_id});
        saveCart();shipMode="air";store.set("ship","air");calcData={};calcStage="form";go("cart")};
      $("qAgain").onclick=()=>{calcData={};calcStage="form";calcErr="";render()};
      return;
    }
    el.innerHTML=`<div class="pcal">

  render();
  if(!db)return;
  const [s,c]=await Promise.all([db.from("settings").select("*").eq("id",1).single(),db.from("coupons").select("*").eq("active",true)]);
  if(s.data){settings=s.data;$("shopName").textContent=settings.shop_name;document.title=settings.shop_name}
  if(c.data)coupons=c.data;
  await loadOrders();render();
  if(preq&&!preq.priced){checkPrice();startPoll()}
}
if(preq&&preq.code&&tab==="home")tab="calc";
document.querySelector("nav.tabs").onclick=async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab==="orders")await loadOrders();go(b.dataset.tab)};
boot();
</script>
</body>
</html>
